name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-rag.txt -r requirements-agent.txt

      # External PubMed, PostgreSQL and Ollama tests stay opt-in.
      - name: Run offline unit tests
        run: python -m pytest -m unit -q -p no:cacheprovider
